name = "card-tab-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Runs on api.cardtab.app (inside the cardtab.app zone) so Cloudflare Image Transformations can resize the art.
routes = [{ pattern = "api.cardtab.app", custom_domain = true }]

# Create these once (see README): a D1 database and an R2 bucket.
[[d1_databases]]
binding = "DB"
database_name = "card-tab"
database_id = "339e10fc-7114-47c3-8c9f-9de4e74d4372"

[[r2_buckets]]
binding = "ART"
bucket_name = "card-tab-art"

[vars]
ALLOWED_ORIGIN = "https://app.cardtab.app"
APP_URL = "https://app.cardtab.app"
API_URL = "https://api.cardtab.app"
MAIL_FROM = "login@cardtab.app"
# Admins (testing tools, plan switch). Comma-separated; checked on the server.
ADMIN_EMAILS = "nklenchik@gmail.com"
# GOOGLE_CLIENT_ID goes here once Google is set up; the client secret is a secret:  wrangler secret put GOOGLE_CLIENT_SECRET
# Email: either Cloudflare Email Service (add a [[send_email]] binding named EMAIL) or  wrangler secret put RESEND_API_KEY

# Secret (never put it in this file):  wrangler secret put JUSTTCG_API_KEY
