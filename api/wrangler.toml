name = "card-tab-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Runs on api.cardtab.app (inside the cardtab.app zone) so Cloudflare Image Transformations can resize the art.
routes = [{ pattern = "api.cardtab.app", custom_domain = true }]

# Create these once (see README): a D1 database and an R2 bucket.
[[d1_databases]]
binding = "DB"
database_name = "card-tab"
database_id = "339e10fc-7114-47c3-8c9f-9de4e74d4372"

[[r2_buckets]]
binding = "ART"
bucket_name = "card-tab-art"

# v50.46: Workers AI (the automatic check on shared card photos). Free daily allowance.
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "https://app.cardtab.app"
APP_URL = "https://app.cardtab.app"
API_URL = "https://api.cardtab.app"
MAIL_FROM = "login@cardtab.app"
# Admins (testing tools, plan switch). Comma-separated; checked on the server.
ADMIN_EMAILS = "nklenchik@gmail.com"
# Google sign-in. The client secret is a secret:  wrangler secret put GOOGLE_CLIENT_SECRET
GOOGLE_CLIENT_ID = "402189262163-0kb6qq7l9igfmvgiqp81plvjk5572to8.apps.googleusercontent.com"
# Email: either Cloudflare Email Service (add a [[send_email]] binding named EMAIL) or  wrangler secret put RESEND_API_KEY

# Secret (never put it in this file):  wrangler secret put JUSTTCG_API_KEY

# v50.63 Premium billing (Stripe). Secrets, set with wrangler secret put: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET.
# The publishable key is public by design. STRIPE_TAX turns on sales tax at checkout once Stripe Tax and the NY registration are set up.
STRIPE_PUBLISHABLE_KEY = "pk_test_51UZQhqAs7GNZKele0ycVJmDzt7boB8zZe2zINnUoRZfknC3juGVIkjULVuAg19QlzsO47xknyBogXXztzJrQFGtC00VonSEri1"
STRIPE_TAX = "off"
# Until launch day only admins can check out; set BILLING_OPEN = "on" with the live keys. BILLING_OPENS is the date people see.
BILLING_OPEN = "off"
BILLING_OPENS = "Dec 1"
# v52.64 the live publishable key (public by design). It's used only once STRIPE_SECRET_KEY is a live key, so both always match.
STRIPE_PUBLISHABLE_KEY_LIVE = ""
# v52.64 the first-two-weeks emails for Free members: "off" pauses them. Plain variables live here (a deploy replaces any set
# in the dashboard), so changing this means a push.
DRIP = "on"

# v50: nightly analytics tidy-up (keeps two years of daily rows). Times are UTC.
[triggers]
crons = ["17 8 * * *", "7 12 * * *", "*/5 * * * *"]   # nightly tidy-up; daily check (v50.12); catalog fill in the last week before the JustTCG reset (v51.3)
