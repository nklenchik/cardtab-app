<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Card Tab Admin</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--page:#f7f5f1;--card:#fff;--card2:#f1eee8;--text:#1a1918;--muted:#77736d;--hair:rgba(0,0,0,.08);--brand:#a50e37;--good:#2e8b4f;--bad:#c0392b;--s1:#a50e37;--s2:#3b6fd8;--s3:#e0a100;--s4:#2e8b7a;--s5:#8a5cd6;--grid:rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#121110;--card:#1d1c1a;--card2:#272523;--text:#f2efe9;--muted:#a19c94;--hair:rgba(255,255,255,.09);--brand:#ff6b8b;--good:#5fd38a;--bad:#ff7a6b;--s1:#ff6b8b;--s2:#6f9bff;--s3:#ffc53d;--s4:#4fd1b8;--s5:#b48cff;--grid:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme=dark]{--page:#121110;--card:#1d1c1a;--card2:#272523;--text:#f2efe9;--muted:#a19c94;--hair:rgba(255,255,255,.09);--brand:#ff6b8b;--good:#5fd38a;--bad:#ff7a6b;--s1:#ff6b8b;--s2:#6f9bff;--s3:#ffc53d;--s4:#4fd1b8;--s5:#b48cff;--grid:rgba(255,255,255,.07);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:500 14px/1.45 Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:800}
.hd h1{margin:0;font-size:20px;letter-spacing:-.02em}
.hd .tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);padding:3px 8px;border-radius:99px}
.hd .sp{flex:1}
.note{font-size:12px;color:var(--muted);font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--page);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--hair);margin-bottom:16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--hair);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--page)}
.chip{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed=true]{border-color:var(--text)}
.sw{width:30px;height:18px;border-radius:99px;background:var(--card2);position:relative;transition:background .2s}.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.chip[aria-pressed=true] .sw{background:var(--brand)}.chip[aria-pressed=true] .sw::after{transform:translateX(12px)}
.range{font-weight:800;font-size:13px;margin-left:auto;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:800;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--hair)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:15px 16px;display:grid;gap:4px}
.kpi small{color:var(--muted);font-weight:700;font-size:12px}
.kpi b{font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi em{font-style:normal;font-size:12px;font-weight:800}
.up{color:var(--good)}.dn{color:var(--bad)}.fl{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:16px;min-width:0}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
.card h3{margin:0 0 2px;font-size:15px}
.card .sub{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}
.chart{position:relative}
.chart svg{display:block;width:100%;height:220px;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--page);font-size:12px;font-weight:700;padding:7px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.list{display:grid;gap:9px}.list .row.low>span:first-child{color:var(--muted)}.list b .nn{font-weight:600;color:var(--muted);font-size:11px}.hint{margin:14px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.row span{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{font-size:13px;font-variant-numeric:tabular-nums}
.row .tr{grid-column:1/-1;height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.row .tr i{display:block;height:100%;border-radius:99px;background:var(--s1);transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.row small{font-weight:800;font-size:11px;margin-left:6px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stack i{display:block;height:100%}
.funnel{display:grid;gap:8px}
.funnel div{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.funnel .bx{height:26px;border-radius:8px;background:var(--s2);opacity:.85;transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.funnel em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--hair)}
td{padding:8px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
.heat{display:grid;grid-template-columns:70px repeat(8,1fr);gap:3px;font-size:11px;font-weight:700}
.heat span{padding:7px 4px;text-align:center;border-radius:6px}
.heat .h{color:var(--muted);background:none;text-align:left}
.priv{font-size:12px;color:var(--muted);font-weight:600;margin-top:16px;display:flex;gap:8px;align-items:center}
@media(max-width:900px){.c8,.c4,.c6{grid-column:span 12}.range{width:100%;margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v50.8 phones: a tidy header (title and close, then App | Website across, then the sample switch), tabs that keep the
   chosen one in view, tables that fit, a stacked funnel and charts drawn for the narrow screen */
@media(max-width:760px){
 .hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding-right:0!important}
 .hd .logo{grid-row:1;grid-column:1}.hd h1{grid-row:1;grid-column:2;min-width:0}.hd .xclose{position:static;grid-row:1;grid-column:3}
 .hd #srcsw{grid-row:2;grid-column:1/-1;display:flex;width:100%;margin:2px 0 0}.hd #srcsw button{flex:1}
 .hd #smp{grid-row:3;grid-column:1/-1;justify-self:start}.hd #mode{grid-row:3;grid-column:1/-1;justify-self:end;align-self:center}
 .hd .note{grid-row:4;grid-column:1/-1;width:auto;font-size:12px}.hd .sp{display:none}
 .tabs{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent);scroll-padding:0 40px}
 .tabs.end{-webkit-mask-image:none;mask-image:none}
 table{font-size:12px}th{padding:6px 5px;font-size:10.5px;line-height:1.25;vertical-align:bottom}td{padding:7px 5px}
 th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0}
 .funnel{gap:12px}.funnel div{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}.funnel .bx{grid-column:1/-1;grid-row:2;height:12px;border-radius:6px}
 .priv{align-items:flex-start;line-height:1.45}.priv svg{flex:none;margin-top:2px}
 .kpi b{overflow-wrap:anywhere}
 .list .row>span:first-child{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
}

/* v50.12 daily check */
.hch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.hch .sub{margin-bottom:0}
.hcsum{font-weight:800;font-size:16px;margin-bottom:10px}.hcsum.up{color:var(--good)}.hcsum.dn{color:var(--bad)}.hcsum.fl{color:#b07a00}.hcsum small{color:var(--muted);font-weight:600;font-size:12.5px}
.hclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 18px}
.pplq{width:100%;box-sizing:border-box;height:42px;border-radius:12px;border:1px solid var(--hair);background:var(--bg,transparent);color:inherit;font:inherit;font-size:14px;padding:0 14px;margin:6px 0 10px}.pplh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 2px}.ppll{display:flex;flex-direction:column}.pplr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}.pplr:last-child{border:0}.pplt{flex:1;min-width:0}.pplt b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pplt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.swt{all:unset;box-sizing:border-box;position:relative;width:44px;height:26px;border-radius:999px;background:var(--hair);cursor:pointer;flex:none;transition:background .2s}.swt i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}.swt[aria-checked="true"]{background:#2f7a16}.swt[aria-checked="true"] i{transform:translateX(18px)}.pplpay{font-size:12px;font-weight:800;color:var(--s3,#2f7a16)}.aql{display:flex;flex-direction:column}.aqr{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}.aqr img{width:52px;height:73px;object-fit:cover;border-radius:4px;display:block}.aqt b{display:block;font-size:13.5px}.aqt em{display:block;font-style:normal;font-weight:800;font-size:12px;color:#a50e37;margin-top:2px}.aqt small{display:block;font-size:11.5px;opacity:.65;margin-top:2px}.aqb{display:flex;gap:6px}.aqok{background:var(--text,#1d1d1b);color:var(--bg,#fff);border-color:transparent}@media(max-width:560px){.aqr{grid-template-columns:44px minmax(0,1fr)}.aqb{grid-column:1/-1}}
.hcr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
.hct{display:grid;min-width:0}.hct small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.hct em{font-style:normal;color:var(--bad);font-size:12px;margin-top:3px}
.hcm{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.hchist{display:flex;gap:3px;margin-top:14px}.hchist i{flex:1;height:18px;border-radius:3px;background:var(--good);opacity:.8}.hchist i.w{background:#e0a100}.hchist i.b{background:var(--bad)}

/* v52.8 People: tappable rows and the account panel */
.pplr{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--hair);cursor:pointer;width:100%;border-radius:10px}
@media(hover:hover){.pplr:hover{background:var(--card2)}}
.pplr:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pdpl{display:inline-block;flex:none;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--muted)}.pdpl.on{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.pdch{flex:none;color:var(--muted)}
.pdw[hidden],.pdbd[hidden]{display:none!important}
.pdx2{display:flex;align-items:center;gap:8px;margin:2px 0 14px}.pdx2 label{flex:1;font-size:12.5px;font-weight:700;color:var(--muted)}.pdx2 input{width:84px;height:36px;border-radius:10px;border:1px solid var(--hair);background:var(--page);color:inherit;font:inherit;font-size:14px;font-weight:800;text-align:center;padding:0 6px}.pdx2 .pdb{height:36px}
.pdbd{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);animation:pdF .2s ease}
.pdw{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(480px,100vw);overflow-y:auto;overscroll-behavior:contain;background:var(--page);border-left:1px solid var(--hair);box-shadow:-24px 0 60px rgba(0,0,0,.25);padding:26px 26px max(30px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:pdIn .28s cubic-bezier(.2,.8,.2,1)}
html.pdopen{overflow:hidden}
@keyframes pdIn{from{transform:translateX(40px);opacity:0}}@keyframes pdUp{from{transform:translateY(100%)}}@keyframes pdF{from{opacity:0}}
.pdhd{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}.pdhd>div{flex:1;min-width:0}
.pdhd h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}.pdsub{margin:0 0 10px;color:var(--muted);font-size:13px;font-weight:600}
.pdx{all:unset;box-sizing:border-box;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card2);cursor:pointer;font-size:13px;font-weight:800}
.pdwarn{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);font-weight:700;font-size:13px}
.pds{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:18px}
.pds h3{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pdrw{display:flex;align-items:center;gap:10px;min-height:40px;font-size:13.5px}.pdrw>span{flex:1;color:var(--muted);font-weight:600}.pdrw>b{font-weight:800;text-align:right}.pdrw small{color:var(--muted);font-weight:600}
.pdm{display:block;height:6px;border-radius:999px;background:var(--card2);overflow:hidden;margin:0 0 8px}.pdm i{display:block;height:100%;border-radius:inherit;background:var(--s2)}.pdm i.full{background:var(--bad)}
.pdn{margin:8px 0 0;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.5}
.pdlbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 0 8px}
.pdseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pdseg button{all:unset;box-sizing:border-box;text-align:center;height:40px;line-height:40px;border-radius:12px;background:var(--card2);font-weight:800;font-size:12.5px;cursor:pointer}
@media(hover:hover){.pdseg button:hover{background:color-mix(in srgb,var(--brand) 14%,var(--card2))}}
.pdacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pdb{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 14px;border-radius:999px;background:var(--card2);font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text);flex:none}
.pdrw .pdb{height:32px;padding:0 12px}
.pdb[disabled]{opacity:.5;cursor:default}
.pdb.warn{color:var(--text)}.pdb.danger{color:var(--bad)}
.pdb.arm{background:var(--bad);color:#fff}
.pdem{display:flex;gap:8px}.pdem input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--hair);background:var(--page);color:inherit;font:inherit;font-size:14px;padding:0 12px}
.pdem .pdb{height:40px}
.pdtg{display:flex;align-items:center;gap:12px;padding:14px 0 0;margin-top:14px;border-top:1px solid var(--hair)}.pdtg>span{flex:1;min-width:0}.pdtg b{display:block;font-size:13.5px}.pdtg small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.swt.danger[aria-checked="true"]{background:var(--bad)}.swt.arm{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 45%,transparent)}
.pdarmn{color:var(--bad)}
.pdh{display:grid;gap:8px;font-size:13px}.pdh div{display:flex;gap:12px}.pdh span{flex:none;width:96px;color:var(--muted);font-weight:600}
.pdmsg{min-height:20px;text-align:center;font-weight:800;font-size:13px;color:var(--good)}
@media(max-width:760px){
 .pdw{top:auto;left:0;width:auto;max-height:92vh;border-left:0;border-top:1px solid var(--hair);border-radius:24px 24px 0 0;padding:20px 16px max(24px,env(safe-area-inset-bottom,0px));animation:pdUp .3s cubic-bezier(.2,.8,.2,1)}
 .pdseg{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){.pdw,.pdbd{animation:none}}
/* v52.20 search and Ask */
.sbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.sbtn:active{transform:scale(.92)}.sbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sk{position:fixed;inset:0;z-index:70}
.skbd{position:absolute;inset:0;background:rgba(10,8,8,.42);animation:skFade .2s ease}
.skp{position:absolute;left:50%;top:max(72px,calc(env(safe-area-inset-top,0px) + 16px));width:min(640px,calc(100vw - 24px));max-height:min(620px,calc(100dvh - 110px));display:flex;flex-direction:column;background:var(--page);border:1px solid var(--hair);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateX(-50%);animation:skIn .24s cubic-bezier(.2,.8,.2,1)}
@keyframes skFade{from{opacity:0}}@keyframes skIn{from{opacity:0;transform:translate(-50%,-8px)}}
.skin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--hair)}
.skin svg{flex:none;color:var(--muted)}
.skin input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:var(--text);outline:none}
.skin input::placeholder{color:var(--muted)}
.skx{all:unset;cursor:pointer;font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--hair);border-radius:8px;padding:4px 7px}
.skx:focus-visible{outline:2px solid var(--brand)}
.skr{overflow-y:auto;overscroll-behavior:contain;padding:8px}
.skrow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;cursor:pointer}
.skrow[aria-selected=true]{background:var(--card2)}
.skrow .ski{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--hair);color:var(--muted)}
.skrow.ask .ski{background:var(--brand);border-color:var(--brand);color:#fff}
.skrow b{display:block;font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skrow small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skrow span.skt{flex:1;min-width:0}
.skrow em{flex:none;font-style:normal;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.skemp{padding:14px 12px;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.5}

    '<div class="aql">'+L.map(x=>'<div class="aqr"><a href="'+esc(src(x.art.detail))+'" target="_blank" rel="noopener"><img src="'+esc(src(x.art.list))+'" alt=""></a><div class="aqt"><b>'+esc(x.name||x.card_id||'')+'</b><em>'+esc(x.reason||'')+(x.seen?' · reads “'+esc(x.seen)+'”':'')+'</em><small>'+esc(x.email||'')+' · '+ago(x.created)+'</small></div><div class="aqb"><button type="button" class="chip" data-aq="reject" data-id="'+esc(x.id)+'">Reject</button><button type="button" class="chip aqok" data-aq="approve" data-id="'+esc(x.id)+'">Approve</button></div></div>').join('')+'</div>');
  const r=document.getElementById('aqr');if(r)r.onclick=()=>aqLoad();el.querySelectorAll('[data-aq]').forEach(b=>b.onclick=()=>aqAct(b.dataset.id,b.dataset.aq))}
// phones: keep the chosen tab in view, and fade the right edge only while more tabs sit off to the side
{const c0=chrome;chrome=function(){c0.apply(this,arguments);const t=document.getElementById('tabs'),on=t&&t.querySelector('[aria-selected=true]');if(!t)return;
  if(on){const l=on.offsetLeft-t.offsetLeft,r=l+on.offsetWidth;if(l<t.scrollLeft+8||r>t.scrollLeft+t.clientWidth-40)t.scrollTo({left:Math.max(0,l-24),behavior:'smooth'})}
  const end=()=>t.classList.toggle('end',t.scrollLeft+t.clientWidth>=t.scrollWidth-4);end();if(!t._e){t._e=1;t.addEventListener('scroll',end,{passive:true})}}}
chrome();paint();load();
</script>
<div class="sk" id="sk" hidden><div class="skbd" id="skbd"></div><div class="skp" role="dialog" aria-modal="true" aria-label="Search or ask"><div class="skin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="skq" type="text" autocomplete="off" enterkeyhint="go" placeholder="Search numbers, or ask a question" aria-label="Search numbers, or ask a question"><button type="button" class="skx" id="skx" aria-label="Close">Esc</button></div><div class="skr" id="skr"></div><div class="skfoot" id="skfoot" hidden></div></div></div>
<script>
/* v52.20 Search and Ask. Search finds any card or number on any page (App and Website) and jumps to it. The list is made by
   drawing every page once with sample numbers and reading the card names, so new cards are found without updating a list.
   Ask sends a question to /auth/admin/ask, which reads the dashboard's real numbers and accounts. */
(function(){
const $=id=>document.getElementById(id),sk=$('sk'),q=$('skq'),out=$('skr'),foot=$('skfoot');
const ICO={c:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>',k:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg>',s:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',a:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>'};
// other words people use for the same things (added to anything whose name contains the key)
const SYN={ask:'questions question ai assistant chat',question:'ask','entries added':'total entries cards logged how many entries count',entr:'entries items purchases sales',purchase:'buys bought spent',sale:'sold sells',sign:'signups signup sign-ups register registrations joined new accounts new users',join:'joined signups waitlist',premium:'paid paying subscribers subscription upgrade upgrades revenue money conversions',upgrad:'premium paid conversions conversion',member:'users accounts people customers total members',active:'users daily active engagement dau',visitor:'traffic visits visitors views',page:'views pages',stor:'stories story video themes',board:'widgets layouts',widget:'board',error:'bugs crashes errors problems',spend:'cost money budget',cost:'spend money price',health:'checks status uptime errors',source:'referrers traffic where from',coming:'retention returning cohorts',time:'minutes seconds duration',game:'pokemon magic one piece tcg',platform:'ebay tcgplayer whatnot',person:'people user account email lookup',find:'search lookup',theme:'stories',funnel:'conversion steps',load:'speed performance slow'};
let IDX=null,SEL=0,ROWS=[],MODE='search',TURNS=[],BUSY=false;
const norm=s=>String(s||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9$%&+ ]+/g,' ').replace(/\s+/g,' ').trim();
function build(){
 const keep={D,st:JSON.stringify(st),cid},sT=window.setTimeout,list=[],[a,b]=range(),box=document.createElement('div');
 window.setTimeout=()=>0;   // pages that load things later (health, people) don't start loading while they're drawn here
 try{
  for(const src of ['app','site']){
   const nav=NAV[src],names=src==='site'?STABS:TABS.concat(['People']),n=src==='site'?STABS.length:11;
   try{D=src==='site'?Object.assign(siteSample(a,b),{_site:1}):sample(a,b)}catch(e){continue}
   st.src=src;
   nav.forEach(x=>list.push({src,t:x[2][0],kind:'s',title:x[0],sub:x[3]||'',where:(src==='site'?'Website':'App')}));
   for(let t=0;t<n;t++){
    const sec=nav.find(x=>x[2].includes(t));if(!sec)continue;const tn=src==='site'?STABS[t]:SUBN[t];
    if(sec[2].length>1)list.push({src,t,kind:'s',title:tn,sub:sec[0],where:(src==='site'?'Website':'App')+' · '+sec[0]});
    let html='';try{if(src==='site')st.stab=t;else st.tab=t;html=(src==='site'?siteViews():views())[t]()}catch(e){continue}
    box.innerHTML=html;const seen={},where=(src==='site'?'Website':'App')+' · '+sec[0]+(sec[2].length>1?' › '+tn:'');
    box.querySelectorAll('.card>h3,.card .hch h3,.kpi>small').forEach(el=>{const title=el.textContent.trim();if(!title)return;const kind=el.tagName==='SMALL'?'k':'c',key=kind+title;seen[key]=(seen[key]||0);
     const card=el.closest('.card'),sub=kind==='c'&&card?((card.querySelector('.sub')||{}).textContent||''):'';
     list.push({src,t,kind,title,sub:sub.trim(),where,nth:seen[key]++})});
   }
  }
 }finally{window.setTimeout=sT;D=keep.D;Object.assign(st,JSON.parse(keep.st));cid=keep.cid;box.innerHTML=''}
 list.forEach(e=>{let h=norm(e.title+' '+e.sub+' '+e.where);const ex=[];for(const k in SYN)if(h.includes(k))ex.push(SYN[k]);e.hay=h+' '+norm(ex.join(' '));e.ht=norm(e.title)});
 return list}
const idx=()=>IDX||(IDX=build());
function score(e,toks,full){let s=0;for(const w of toks){const re=new RegExp('(^| )'+w.replace(/[$+]/g,'\\$&'));if(re.test(e.ht))s+=4;else if(re.test(e.hay))s+=1.5;else if(w.length>=4&&e.hay.includes(w))s+=.8;else return 0}
 if(e.ht===full)s+=8;else if(e.hay.includes(full)&&toks.length>1)s+=3;else if(e.ht.startsWith(full))s+=4;if(e.src===st.src)s+=.6;if(e.kind==='k')s+=.3;return s}
const looksAsk=s=>/\?\s*$/.test(s)||(s.trim().split(/\s+/).length>=3&&/^(how|what|whats|who|which|when|why|where|is|are|did|does|do|was|were|can|show|tell|list|compare|give)\b/i.test(s.trim()));
function search(){const raw=q.value.trim(),full=norm(raw),toks=full.split(' ').filter(Boolean);ROWS=[];
 if(toks.length){const r=idx().map(e=>[score(e,toks,full),e]).filter(x=>x[0]>0).sort((x,y)=>y[0]-x[0]);const seen=new Set();
  for(const [,e] of r){const k=e.src+e.t+e.kind+e.title;if(seen.has(k))continue;seen.add(k);ROWS.push({e});if(ROWS.length>=8)break}}
 if(raw){const ask={ask:raw};if(looksAsk(raw)||!ROWS.length)ROWS.unshift(ask);else ROWS.push(ask)}
 SEL=0;paint()}
function paint(){
 if(MODE==='chat')return;foot.hidden=true;
 if(!q.value.trim()){out.innerHTML='<div class="skemp">Type what you’re looking for, like <b>ask questions</b>, <b>total entries</b> or <b>sign-ups</b>, and pick it to jump there.<br>Or ask a question about your numbers or a person, like <b>How many people upgraded this week?</b> or <b>Tell me about someone@email.com</b>.</div>';return}
 out.innerHTML=ROWS.map((r,i)=>r.ask?'<button type="button" class="skrow ask" role="option" data-i="'+i+'" aria-selected="'+(i===SEL)+'"><span class="ski">'+ICO.a+'</span><span class="skt"><b>Ask: '+esc(r.ask)+'</b><small>Answers from your real numbers and accounts</small></span></button>'
  :'<button type="button" class="skrow" role="option" data-i="'+i+'" aria-selected="'+(i===SEL)+'"><span class="ski">'+ICO[r.e.kind]+'</span><span class="skt"><b>'+esc(r.e.title)+'</b><small>'+esc(r.e.where)+'</small></span><em>'+(r.e.kind==='k'?'Number':r.e.kind==='s'?'Page':'Chart')+'</em></button>').join('')||'<div class="skemp">Nothing found.</div>';
 const s=out.querySelector('[aria-selected=true]');if(s)s.scrollIntoView({block:'nearest'})}
function open(){if(!sk.hidden)return;sk.hidden=false;document.body.style.overflow='hidden';if(MODE==='chat'){q.placeholder='Ask a follow-up';}q.value='';search();setTimeout(()=>q.focus(),20);setTimeout(idx,30)}
function close(){sk.hidden=true;document.body.style.overflow='';q.blur()}
function pick(i){const r=ROWS[i];if(!r)return;if(r.ask)return ask(r.ask);jump(r.e)}
// go to a card: switch App/Website and page, then find it, bring it into view and outline it for a moment
function jump(e){close();const re=st.src!==e.src;st.src=e.src;if(e.src==='site')st.stab=e.t;else st.tab=e.t;st.last=st.last||{};const sec=secOf();st.last[st.src+':'+sec[0]]=e.t;
 if(re)changed();else{save();chrome();paint0()}
 if(e.kind==='s'){scrollTo({top:0,behavior:'smooth'});return}
 let tries=0;(function find(){const v=$('view');const els=v&&!v.classList.contains('load')?[...v.querySelectorAll(e.kind==='k'?'.kpi>small':'.card>h3,.card .hch h3')].filter(x=>x.textContent.trim()===e.title):[];
  const el=els[e.nth||0]||els[0];if(!el){if(++tries<50)setTimeout(find,100);return}
  const box=el.closest(e.kind==='k'?'.kpi':'.card');if(getComputedStyle(box).position==='static')box.style.position='relative';
  box.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  const ring=document.createElement('span');ring.className='skring';box.appendChild(ring);setTimeout(()=>ring.remove(),2100)})()}
const paint0=window.paint;
// ---------- Ask ----------
function chatPaint(){out.innerHTML='<div class="skchat">'+TURNS.map(t=>t.role==='user'?'<div class="skq">'+esc(t.content)+'</div>':'<div class="ska'+(t.err?' err':'')+'">'+esc(t.content)+(t.show&&t.show.length?'<div class="skgo">'+t.show.map(s=>'<button type="button" data-show="'+esc(s)+'">Show me: '+esc(s)+' →</button>').join('')+'</div>':'')+'</div>').join('')+(BUSY?'<div class="ska"><span class="skdots" aria-label="Thinking"><i></i><i></i><i></i></span></div>':'')+'</div>';
 foot.hidden=false;foot.innerHTML='<span>Real numbers · uses the Ask budget</span><button type="button" id="sknew">New search</button>';out.scrollTop=out.scrollHeight}
async function ask(text){MODE='chat';q.value='';q.placeholder='Ask a follow-up';const prior=TURNS.filter(t=>!t.err).map(t=>({role:t.role,content:t.content}));TURNS.push({role:'user',content:text});BUSY=true;chatPaint();
 let a;try{
  if(!REAL)a={err:1,content:'Ask works on the live dashboard (app.cardtab.app/admin), where it can read your real numbers.'};
  else{const [f,t]=range(),spots=[...new Set(idx().filter(e=>e.kind!=='s').map(e=>e.title))];
   const r=await fetch(API+'/auth/admin/ask',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({q:text,turns:prior,view:{label:perLabel()+' · '+(st.src==='site'?'Website':'App'),from:f,to:t},spots})});
   const j=await r.json().catch(()=>({}));
   a=j.text?{content:j.text,show:j.show||[]}:{err:1,content:j.error==='cap'?'This month’s Ask spending cap has been reached, so Ask is paused until the 1st.':j.error==='setup'?'Ask isn’t set up on the server yet.':'Ask couldn’t answer just now. '+(j.detail?'('+j.detail+')':'Try again in a moment.')}}
 }catch(e){a={err:1,content:'Couldn’t reach the server. Check the connection and try again.'}}
 BUSY=false;TURNS.push(Object.assign({role:'assistant'},a));if(!sk.hidden)chatPaint();q.focus()}
function showMe(title){const l=idx().filter(e=>e.title===title&&e.kind!=='s');const e=l.find(x=>x.src===st.src)||l[0];if(e)jump(e)}
// ---------- wiring ----------
$('sbtn').onclick=open;$('skbd').onclick=close;$('skx').onclick=close;
q.addEventListener('input',()=>{if(MODE==='chat')return;search()});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();return}
 if(MODE==='chat'){if(e.key==='Enter'&&q.value.trim()&&!BUSY){e.preventDefault();ask(q.value.trim())}return}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!ROWS.length)return;SEL=(SEL+(e.key==='ArrowDown'?1:-1)+ROWS.length)%ROWS.length;paint()}
 else if(e.key==='Enter'){e.preventDefault();pick(SEL)}});
out.addEventListener('click',e=>{const s=e.target.closest('[data-show]');if(s)return showMe(s.dataset.show);const r=e.target.closest('[data-i]');if(r)pick(+r.dataset.i)});
foot.addEventListener('click',e=>{if(e.target.id==='sknew'){MODE='search';TURNS=[];q.placeholder='Search numbers, or ask a question';q.value='';search();q.focus()}});
document.addEventListener('keydown',e=>{const tg=e.target,typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable);
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();sk.hidden?open():close();return}
 if(e.key==='/'&&!typing&&sk.hidden){e.preventDefault();open()}});
})();
</script>

(function(){const fab=document.getElementById('navfab'),bd=document.getElementById('navbd'),side=document.getElementById('side');if(!fab||!side)return;

 addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;const y=scrollY,d=y-lastY;
  if(document.body.classList.contains('navopen')){lastY=y;return}
