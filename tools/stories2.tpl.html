<title>Card Stories Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: the original Card Stories, made real. A Board | Stories switch, a time range, a row of themes, then five story cards in a row (a swipeable strip on phones). Each card has one "Showing" switch; tap a card to enlarge it. */
:root{--bg:#f6f5f0;--card:#fff;--text:#1d1d1b;--muted:#6f6e68;--line:#e2e0d8;--brand:#a50e37;--hl:#efede5;--f:Manrope,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--card:#262624;--text:#f1efe8;--muted:#a4a4a0;--line:#383836;--brand:#c7234f;--hl:#31312e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1a;--card:#262624;--text:#f1efe8;--muted:#a4a4a0;--line:#383836;--brand:#c7234f;--hl:#31312e;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap>*{min-width:0}
button{font-family:var(--f);color:inherit}button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.ttl{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0}
.seg{display:inline-flex;background:var(--hl);border-radius:999px;padding:3px}
.seg button{white-space:nowrap;border:0;background:none;padding:8px 16px;font-weight:800;font-size:14px;color:var(--muted);border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.controls{display:grid;gap:14px;justify-items:center;margin-bottom:22px}
.tl2{display:flex;align-items:center;gap:14px;min-width:0}.tl2 .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 9px;font-weight:750;font-size:13.5px;cursor:pointer;flex:none}
@media(max-width:600px){.back span{display:none}.back{padding:9px}.ttl{font-size:20px}}
.perw{position:relative}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--text);color:var(--bg);font-weight:800;font-size:13.5px;padding:10px 16px;cursor:pointer;white-space:nowrap}.pill i{font-style:normal;font-size:10px;opacity:.7}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.16);display:grid;animation:mIn .22s cubic-bezier(.18,.89,.32,1.12) both;transform-origin:top right}
@keyframes mIn{from{opacity:0;transform:translateY(-6px) scale(.96)}}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.menu button:hover{background:var(--hl)}.menu button[aria-checked="true"]::after{content:"✓";color:var(--brand);font-weight:800}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.tchip.more{color:var(--text)}
.rbw{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.6) 22%,rgba(255,255,255,0) 62%),conic-gradient(from 90deg,#ff2d2d,#ff9a1f,#ffe83b,#62e34a,#22d3e6,#3b5bff,#c33bff,#ff3bb0,#ff2d2d);box-shadow:0 0 0 1.5px var(--ring),inset 0 0 0 1px rgba(128,128,128,.25)}
.sheetw{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(8,8,8,.5);padding:20px;animation:fade .25s ease both}
.sheetw.out{animation:fadeo .2s ease both}
.sheet{width:min(560px,100%);max-height:calc(100dvh - 40px);background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:rise .36s cubic-bezier(.18,.89,.32,1.08) both;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet.sm{width:min(400px,100%)}
@media(max-width:600px){.sheetw{place-items:end stretch;padding:0}.sheet{width:100%!important;border-radius:22px 22px 0 0;max-height:88dvh;animation:up .38s cubic-bezier(.2,.9,.25,1) both;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}}
@keyframes up{from{transform:translateY(100%)}}
.shh{display:flex;justify-content:space-between;align-items:center}.shh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.xx{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--muted);font-size:14px;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:2px 4px 4px}
.topt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:800;font-size:14px;transition:border-color .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
.topt:hover{transform:translateY(-1px);border-color:var(--muted)}
.topt[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.mini{display:flex;gap:3px;flex:none}.mini i{width:14px;height:24px;border-radius:4px;display:block;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.topt{min-width:0}.topt>span:last-child,.topt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){.mini i:nth-child(n+4){display:none}.topt{gap:9px;padding:9px 10px;font-size:13.5px}}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mrow2 label{display:grid;gap:6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mrow2 select{font:inherit;font-size:15px;font-weight:700;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-transform:none;letter-spacing:0}
.crn{margin:0;font-size:13px;font-weight:650;color:var(--muted);min-height:18px}
.go{border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;padding:14px;cursor:pointer}.go:disabled{opacity:.45;cursor:not-allowed}
.thm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;overflow-x:visible;scrollbar-width:none;max-width:100%;padding:2px 2px 6px}
.thm::-webkit-scrollbar{display:none}
.tchip{flex:none;font-weight:800;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px 8px 9px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;--ring:var(--card);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tchip:hover{transform:translateY(-1px)}
.tchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);--ring:var(--text)}
.tsw{display:inline-flex}.tsw span{width:12px;height:12px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px var(--ring),inset 0 0 0 1px rgba(128,128,128,.4)}
@media(max-width:600px){.tchip{gap:7px;padding:8px 12px 8px 9px}.tsw span{width:11px;height:11px}}.tsw span+span{margin-left:-4px}
/* the strip of stories */
.track{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
@media(max-width:760px){.track{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 14px;scrollbar-width:none;scroll-padding:0 16px}.track::-webkit-scrollbar{display:none}}
.cell{flex:none;display:grid;gap:12px;justify-items:center;scroll-snap-align:center}
.mb{font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;transition:border-color .2s}
.mb:hover{border-color:var(--text)}.mb .k{color:var(--muted);font-weight:700}
.dots{display:none;justify-content:center;gap:6px;margin-top:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}.dots i.on{background:var(--text);transform:scale(1.2)}
@media(max-width:760px){.dots{display:flex}}
/* a story card: everything sized from the card itself, so it reads the same small or enlarged */
.sl{width:236px;aspect-ratio:9/16;border-radius:16px;container-type:size;position:relative;overflow:hidden;cursor:zoom-in;text-align:left;border:0;padding:0;color:var(--ink);background:var(--sbg);transition:background .45s ease,color .45s ease,transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.cell .sl:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.18)}
@media(max-width:760px){.sl{width:72vw;max-width:300px}}
.sl .in{position:absolute;inset:8cqmin 8cqmin 14cqmin;display:grid;grid-template-rows:auto 1fr;gap:5cqmin;min-height:0}
.sl .in>div{min-width:0;min-height:0}
.sl.swap .in{animation:swap .42s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(3cqmin)}}
.sl .ft{position:absolute;left:8cqmin;right:8cqmin;bottom:6cqmin;display:flex;justify-content:space-between;font-weight:800;font-size:3.1cqmin;opacity:.7}
.sl .lab{font-size:3cqmin;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.sl .h{font-weight:800;letter-spacing:-.035em;line-height:1.1;font-size:10cqmin;margin:4cqmin 0 0;padding-bottom:.14em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sl .num{font-weight:800;letter-spacing:-.05em;line-height:.92;font-variant-numeric:tabular-nums;color:var(--acc);margin-top:4cqmin;white-space:nowrap}
.sl .num small{font-size:.34em;letter-spacing:0;color:var(--ink);opacity:.85;margin-left:2cqmin}
.sl .p{font-size:4.4cqmin;line-height:1.35;font-weight:600;opacity:.88;margin:3cqmin 0 0}
.sl .chips{display:flex;gap:2cqmin;flex-wrap:wrap;margin-top:5cqmin}
.sl .chip{font-weight:800;font-size:3.3cqmin;border-radius:99cqmin;padding:1.8cqmin 3.4cqmin;background:var(--chip);color:var(--chipink);white-space:nowrap}
.sl .chip.o{background:var(--chip2);color:var(--ink)}
.sl .vis{position:relative}
.sl .card.art{background-size:cover!important;background-position:center!important;box-shadow:0 4cqmin 6cqmin rgba(0,0,0,.28)!important}
.card{position:absolute;width:52cqmin;aspect-ratio:63/88;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-5deg);border-radius:2.4cqmin;display:grid;place-items:center;font-weight:800;font-size:20cqmin;color:#fff;background:linear-gradient(155deg,#d9577a,#7d0b2b);box-shadow:inset 0 0 0 1.4cqmin rgba(255,255,255,.22),0 4cqmin 6cqmin rgba(0,0,0,.28)}
.sl .stk{position:absolute;right:2cqmin;top:28%;transform:rotate(9deg);background:var(--stk);color:var(--stki);font-weight:800;font-size:5.4cqmin;border-radius:3cqmin;padding:2.4cqmin 3.4cqmin;box-shadow:0 2cqmin 4cqmin rgba(0,0,0,.25);white-space:nowrap}
.sl .rr{margin-top:3.6cqmin}.sl .rr:first-child{margin-top:0}
.sl .rt{display:flex;justify-content:space-between;gap:3cqmin;font-weight:800;font-size:3.9cqmin;margin-bottom:1.5cqmin}.sl .rt span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl .rt span:last-child{opacity:.75}
.sl .bk{height:2.8cqmin;border-radius:2cqmin;background:var(--trk)}.sl .bk i{display:block;height:100%;border-radius:2cqmin;background:var(--acc)}
.sl .bars{position:absolute;left:0;right:0;bottom:6cqmin;top:4cqmin;display:flex;gap:1.6cqmin;align-items:flex-end}
.sl .bars>i{flex:1;display:block;border-radius:1.6cqmin 1.6cqmin 0 0;background:var(--acc)}.sl .bars>i.o{background:var(--o)}
.sl .bl{position:absolute;left:-1cqmin;right:-1cqmin;border-top:.5cqmin dashed var(--dash)}
.sl .mon{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1.6cqmin}.sl .mon span{flex:1;text-align:center;font-size:2.6cqmin;font-weight:800;opacity:.6}
.sl .fan{position:absolute;inset:0}
.sl .fan .card{width:36cqmin;font-size:9cqmin;place-items:start;padding:2.6cqmin 3cqmin;line-height:1}
.sl .fan .card:nth-child(1){transform:translate(-110%,-45%) rotate(-12deg)}.sl .fan .card:nth-child(2){transform:translate(-50%,-56%)}.sl .fan .card:nth-child(3){transform:translate(10%,-45%) rotate(12deg)}
.sl .tl{display:grid;gap:4cqmin;margin-top:4cqmin}
.sl .tl div{display:grid;grid-template-columns:3.6cqmin 1fr auto;gap:3cqmin;align-items:center;font-weight:800;font-size:4.2cqmin}
.sl .tl i{width:3.6cqmin;height:3.6cqmin;border-radius:50%;background:var(--acc)}.sl .tl small{display:block;font-weight:650;font-size:3.2cqmin;opacity:.7}
/* enlarged */
.lb{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,8,8,.86);padding:20px;animation:fade .25s ease both}
.lb.out{animation:fadeo .2s ease both}
@keyframes fade{from{opacity:0}}@keyframes fadeo{to{opacity:0}}
.lb .box{display:grid;gap:14px;justify-items:center;animation:rise .4s cubic-bezier(.18,.89,.32,1.08) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}}
.lb .sl{width:min(380px,calc((100dvh - 200px)*9/16),calc(100vw - 40px));cursor:default;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.lb .acts{display:flex;gap:10px}
.lb .acts button{border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:14.5px;cursor:pointer;background:#fff;color:#1d1d1b}.lb .acts button.g{background:rgba(255,255,255,.16);color:#fff}
.lb .note{color:rgba(255,255,255,.75);font-size:12.5px;font-weight:650;min-height:18px;margin:0}
.foot{margin:26px auto 0;text-align:center;color:var(--muted);font-size:13px;font-weight:650;max-width:560px}
@media(max-width:420px){#per button{padding:8px 11px;font-size:13px}}
/* v33.1: phones: the app's bar sits under Stories, so Save and Share move up beside your avatar; desktop: the app's tabs beside the title */
.csic{display:none}
@media(max-width:760px){html .csdock{display:none!important}.csic{display:flex;gap:8px;position:absolute;z-index:6}
 .csic button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid var(--line);background:color-mix(in srgb,currentColor 7%,transparent);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
 .csic button:active{transform:scale(.92)}.csic button svg{width:17px;height:17px}}
.cstabs{display:none}
@media(min-width:761px){.cstabs{display:flex;gap:4px;padding:4px;margin-left:16px;border-radius:999px;background:var(--hl,rgba(0,0,0,.05));align-self:center}
 .cstabs button{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px;border:0;border-radius:999px;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:750;white-space:nowrap;cursor:pointer}
 .cstabs button:hover{color:var(--text)}
 .cstabs button[aria-current]{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cstabs button[aria-current]{background:rgba(255,128,165,.17);color:#ff8db0}}
:root[data-theme="dark"] .cstabs button[aria-current]{background:rgba(255,128,165,.17);color:#ff8db0}
/* v33.6: no back arrow: the app's bar (phones) and tabs (desktop) already take you back */
@media(max-width:760px){.top .back{visibility:hidden!important;pointer-events:none}}
@media(min-width:761px){.top .tl2:has(.cstabs) .back{display:none!important}}
/* v33.7 phones: the same slim bar as the other pages: slides in once the title scrolls away, title + Save · Share, no back arrow */
.csslim{display:none}
@media(max-width:760px){
 .csslim{display:flex;align-items:center;gap:8px;position:fixed;left:0;right:0;top:0;z-index:50;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px 18px;transform:translateY(-110%);transition:transform .8s cubic-bezier(.4,0,.2,1);pointer-events:none}
 .csslim::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.06)}
 .csslim.on{transform:none;pointer-events:auto;transition:transform .8s cubic-bezier(.22,.61,.36,1)}

 .csslim .sic button svg{width:15px;height:15px}
 .csslim .sic .me{width:38px;height:38px;border:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background-size:cover!important;background-position:center!important}
}

/* v31: shared window style: frosted blur behind every sheet, hairline around it */

:root[data-theme="dark"]{--win-veil:rgba(0,0,0,.42);--win-edge:rgba(255,255,255,.1)}

.shs{margin:4px 0 0;font-size:13.5px;font-weight:650;color:var(--muted);min-height:1.4em}

.tgrid{gap:12px;padding:4px 4px 8px}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
