<title>Card Stories Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: the original Card Stories, made real. A Board | Stories switch, a time range, a row of themes, then five story cards in a row (a swipeable strip on phones). Each card has one "Showing" switch; tap a card to enlarge it. */
:root{--bg:#f6f5f0;--card:#fff;--text:#1d1d1b;--muted:#6f6e68;--line:#e2e0d8;--brand:#a50e37;--hl:#efede5;--f:Manrope,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--card:#262624;--text:#f1efe8;--muted:#a4a4a0;--line:#383836;--brand:#c7234f;--hl:#31312e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1a;--card:#262624;--text:#f1efe8;--muted:#a4a4a0;--line:#383836;--brand:#c7234f;--hl:#31312e;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap>*{min-width:0}
button{font-family:var(--f);color:inherit}button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.ttl{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0}
.seg{display:inline-flex;background:var(--hl);border-radius:999px;padding:3px}
.seg button{white-space:nowrap;border:0;background:none;padding:8px 16px;font-weight:800;font-size:14px;color:var(--muted);border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.controls{display:grid;gap:14px;justify-items:center;margin-bottom:22px}
.tl2{display:flex;align-items:center;gap:14px;min-width:0}.tl2 .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 9px;font-weight:750;font-size:13.5px;cursor:pointer;flex:none}
@media(max-width:600px){.back span{display:none}.back{padding:9px}.ttl{font-size:20px}}
.perw{position:relative}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--text);color:var(--bg);font-weight:800;font-size:13.5px;padding:10px 16px;cursor:pointer;white-space:nowrap}.pill i{font-style:normal;font-size:10px;opacity:.7}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.16);display:grid;animation:mIn .22s cubic-bezier(.18,.89,.32,1.12) both;transform-origin:top right}
@keyframes mIn{from{opacity:0;transform:translateY(-6px) scale(.96)}}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.menu button:hover{background:var(--hl)}.menu button[aria-checked="true"]::after{content:"✓";color:var(--brand);font-weight:800}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.tchip.more{padding:8px 14px;color:var(--text)}
.sheetw{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(8,8,8,.5);padding:20px;animation:fade .25s ease both}
.sheetw.out{animation:fadeo .2s ease both}
.sheet{width:min(560px,100%);max-height:calc(100dvh - 40px);background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:rise .36s cubic-bezier(.18,.89,.32,1.08) both;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet.sm{width:min(400px,100%)}
@media(max-width:600px){.sheetw{place-items:end stretch;padding:0}.sheet{width:100%!important;border-radius:22px 22px 0 0;max-height:88dvh;animation:up .38s cubic-bezier(.2,.9,.25,1) both;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}}
@keyframes up{from{transform:translateY(100%)}}
.shh{display:flex;justify-content:space-between;align-items:center}.shh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.xx{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--muted);font-size:14px;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:2px 4px 4px}
.topt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:800;font-size:14px;transition:border-color .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
.topt:hover{transform:translateY(-1px);border-color:var(--muted)}
.topt[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.mini{display:flex;gap:3px;flex:none}.mini i{width:14px;height:24px;border-radius:4px;display:block;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.topt{min-width:0}.topt>span:last-child,.topt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){.mini i:nth-child(n+4){display:none}.topt{gap:9px;padding:9px 10px;font-size:13.5px}}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mrow2 label{display:grid;gap:6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mrow2 select{font:inherit;font-size:15px;font-weight:700;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-transform:none;letter-spacing:0}
.crn{margin:0;font-size:13px;font-weight:650;color:var(--muted);min-height:18px}
.go{border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;padding:14px;cursor:pointer}.go:disabled{opacity:.45;cursor:not-allowed}
.thm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;overflow-x:visible;scrollbar-width:none;max-width:100%;padding:2px 2px 6px}
.thm::-webkit-scrollbar{display:none}
.tchip{flex:none;font-weight:800;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px 8px 9px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;--ring:var(--card);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tchip:hover{transform:translateY(-1px)}
.tchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);--ring:var(--text)}
.tsw{display:inline-flex}.tsw span{width:12px;height:12px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px var(--ring),inset 0 0 0 1px rgba(128,128,128,.4)}.tsw span+span{margin-left:-4px}
/* the strip of stories */
.track{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
@media(max-width:760px){.track{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 14px;scrollbar-width:none;scroll-padding:0 16px}.track::-webkit-scrollbar{display:none}}
.cell{flex:none;display:grid;gap:12px;justify-items:center;scroll-snap-align:center}
.mb{font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;transition:border-color .2s}
.mb:hover{border-color:var(--text)}.mb .k{color:var(--muted);font-weight:700}
.dots{display:none;justify-content:center;gap:6px;margin-top:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}.dots i.on{background:var(--text);transform:scale(1.2)}
@media(max-width:760px){.dots{display:flex}}
/* a story card: everything sized from the card itself, so it reads the same small or enlarged */
.sl{width:236px;aspect-ratio:9/16;border-radius:16px;container-type:size;position:relative;overflow:hidden;cursor:zoom-in;text-align:left;border:0;padding:0;color:var(--ink);background:var(--sbg);transition:background .45s ease,color .45s ease,transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.cell .sl:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.18)}
@media(max-width:760px){.sl{width:72vw;max-width:300px}}
.sl .in{position:absolute;inset:8cqmin 8cqmin 14cqmin;display:grid;grid-template-rows:auto 1fr;gap:5cqmin;min-height:0}
.sl .in>div{min-width:0;min-height:0}
.sl.swap .in{animation:swap .42s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(3cqmin)}}
.sl .ft{position:absolute;left:8cqmin;right:8cqmin;bottom:6cqmin;display:flex;justify-content:space-between;font-weight:800;font-size:3.1cqmin;opacity:.7}
.sl .lab{font-size:3cqmin;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.sl .h{font-weight:800;letter-spacing:-.035em;line-height:1.04;font-size:10cqmin;margin:3.2cqmin 0 0;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sl .num{font-weight:800;letter-spacing:-.05em;line-height:.92;font-variant-numeric:tabular-nums;color:var(--acc);margin-top:4cqmin;white-space:nowrap}
.sl .num small{font-size:.34em;letter-spacing:0;color:var(--ink);opacity:.85;margin-left:2cqmin}
.sl .p{font-size:4.4cqmin;line-height:1.35;font-weight:600;opacity:.88;margin:3cqmin 0 0}
.sl .chips{display:flex;gap:2cqmin;flex-wrap:wrap;margin-top:5cqmin}
.sl .chip{font-weight:800;font-size:3.3cqmin;border-radius:99cqmin;padding:1.8cqmin 3.4cqmin;background:var(--chip);color:var(--chipink);white-space:nowrap}
.sl .chip.o{background:var(--chip2);color:var(--ink)}
.sl .vis{position:relative}
.sl .card{position:absolute;width:52cqmin;aspect-ratio:63/88;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-5deg);border-radius:2.4cqmin;display:grid;place-items:center;font-weight:800;font-size:20cqmin;color:#fff;background:linear-gradient(155deg,#d9577a,#7d0b2b);box-shadow:inset 0 0 0 1.4cqmin rgba(255,255,255,.22),0 4cqmin 6cqmin rgba(0,0,0,.28)}
.sl .stk{position:absolute;right:2cqmin;top:28%;transform:rotate(9deg);background:var(--stk);color:var(--stki);font-weight:800;font-size:5.4cqmin;border-radius:3cqmin;padding:2.4cqmin 3.4cqmin;box-shadow:0 2cqmin 4cqmin rgba(0,0,0,.25);white-space:nowrap}
.sl .rr{margin-top:3.6cqmin}.sl .rr:first-child{margin-top:0}
.sl .rt{display:flex;justify-content:space-between;gap:3cqmin;font-weight:800;font-size:3.9cqmin;margin-bottom:1.5cqmin}.sl .rt span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl .rt span:last-child{opacity:.75}
.sl .bk{height:2.8cqmin;border-radius:2cqmin;background:var(--trk)}.sl .bk i{display:block;height:100%;border-radius:2cqmin;background:var(--acc)}
.sl .bars{position:absolute;left:0;right:0;bottom:6cqmin;top:4cqmin;display:flex;gap:1.6cqmin;align-items:flex-end}
.sl .bars>i{flex:1;display:block;border-radius:1.6cqmin 1.6cqmin 0 0;background:var(--acc)}.sl .bars>i.o{background:var(--o)}
.sl .bl{position:absolute;left:-1cqmin;right:-1cqmin;border-top:.5cqmin dashed var(--dash)}
.sl .mon{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1.6cqmin}.sl .mon span{flex:1;text-align:center;font-size:2.6cqmin;font-weight:800;opacity:.6}
.sl .fan{position:absolute;inset:0}
.sl .fan .card{width:36cqmin;font-size:13cqmin}
.sl .fan .card:nth-child(1){transform:translate(-110%,-45%) rotate(-12deg)}.sl .fan .card:nth-child(2){transform:translate(-50%,-56%)}.sl .fan .card:nth-child(3){transform:translate(10%,-45%) rotate(12deg)}
.sl .tl{display:grid;gap:4cqmin;margin-top:4cqmin}
.sl .tl div{display:grid;grid-template-columns:3.6cqmin 1fr auto;gap:3cqmin;align-items:center;font-weight:800;font-size:4.2cqmin}
.sl .tl i{width:3.6cqmin;height:3.6cqmin;border-radius:50%;background:var(--acc)}.sl .tl small{display:block;font-weight:650;font-size:3.2cqmin;opacity:.7}
/* enlarged */
.lb{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,8,8,.86);padding:20px;animation:fade .25s ease both}
.lb.out{animation:fadeo .2s ease both}
@keyframes fade{from{opacity:0}}@keyframes fadeo{to{opacity:0}}
.lb .box{display:grid;gap:14px;justify-items:center;animation:rise .4s cubic-bezier(.18,.89,.32,1.08) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}}
.lb .sl{width:min(380px,calc((100dvh - 200px)*9/16),calc(100vw - 40px));cursor:default;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.lb .acts{display:flex;gap:10px}
.lb .acts button{border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:14.5px;cursor:pointer;background:#fff;color:#1d1d1b}.lb .acts button.g{background:rgba(255,255,255,.16);color:#fff}
.lb .note{color:rgba(255,255,255,.75);font-size:12.5px;font-weight:650;min-height:18px;margin:0}
.foot{margin:26px auto 0;text-align:center;color:var(--muted);font-size:13px;font-weight:650;max-width:560px}
@media(max-width:420px){#per button{padding:8px 11px;font-size:13px}}
/* ---- themes sheet, roomier ---- */
.shs{margin:4px 0 0;font-size:13.5px;font-weight:650;color:var(--muted);min-height:1.4em}
.shs.msg{color:var(--text);font-weight:800}
.tgrid{gap:12px;padding:4px 4px 8px}
.topt{gap:14px;padding:16px;border-radius:18px;min-height:64px;font-size:15px;--ring:var(--card)}
.tsw.big{flex:none}
.tsw.big span{width:20px;height:20px;box-shadow:0 0 0 2px var(--ring),inset 0 0 0 1px rgba(128,128,128,.4)}
.tsw.big span+span{margin-left:-6px}
#ths .go{flex:none}
@media(max-width:420px){.topt{gap:12px;padding:14px 13px;font-size:14.5px}.tsw.big span{width:18px;height:18px}}
#lbc{display:grid;place-items:center}
/* ---- v2.6: date sheet with month tiles; phone quick picks ---- */
.spre{display:none}
#crs.pre .spre{display:grid;gap:8px}
#crs.pre:not(.cust) .mpk{display:none}
#crs .sheet{overflow-y:auto;overscroll-behavior:contain}
.mpk{display:grid;gap:12px}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font:inherit;font-weight:750;font-size:15.5px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.srow .ck{margin-left:auto;color:var(--brand);font-weight:900;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
.srow[aria-checked="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.srow[aria-checked="true"] .ck{opacity:1;transform:none}
.srow .cv{margin-left:auto;color:var(--muted);font-size:20px;line-height:1;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.srow[aria-expanded="true"] .cv{transform:rotate(90deg)}
.msum{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;color:var(--muted)}
.mb2{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 12px;cursor:pointer;font:inherit;color:var(--text)}
.mb2 small{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mb2 b{font-size:15px;font-weight:800;white-space:nowrap}
.mb2.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.mgrid{display:grid;gap:14px}
.myr{display:grid;gap:8px}.myr>b{font-size:13px;font-weight:800;color:var(--muted)}
.mtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 0}
.mt{height:44px;border:0;background:transparent;color:var(--text);font:inherit;font-weight:750;font-size:14.5px;cursor:pointer;border-radius:12px;position:relative;-webkit-tap-highlight-color:transparent}
.mt:disabled{opacity:.28;cursor:default}
.mt.in{background:color-mix(in srgb,var(--brand) 13%,transparent);border-radius:0}
.mt.sel{background:var(--brand);color:#fff}
.mt.rs{border-radius:12px 0 0 12px}.mt.re{border-radius:0 12px 12px 0}
.mtiles .mt.in:nth-child(4n+1),.mtiles .mt.re:nth-child(4n+1){border-top-left-radius:12px;border-bottom-left-radius:12px}
.mtiles .mt.in:nth-child(4n),.mtiles .mt.rs:nth-child(4n){border-top-right-radius:12px;border-bottom-right-radius:12px}
@media(hover:hover){.mt:not(:disabled):not(.sel):hover{background:color-mix(in srgb,var(--text) 7%,transparent)}}
/* ---- v2.5 phone variants (set by the board build: html.vA / html.vB) ---- */
.csdock,.cstoast{display:none}
@media(max-width:600px){
  html.vA .top .back,html.vB .top .back{border:0;background:transparent;width:36px;height:40px;padding:0;margin-left:-10px;justify-content:center}
  html.vA .top .back svg,html.vB .top .back svg{width:22px;height:22px}
  html.vA .top{display:grid;gap:2px;justify-items:start}
  html.vA .tl2{display:grid;gap:4px}
  html.vA .ttl{font-size:34px;line-height:1.05;letter-spacing:-.03em}
  html.vA #perb{background:transparent;border:0;color:var(--text);padding:0;height:34px;font-size:15.5px;box-shadow:none}
  html.vA .wrap,html.vB .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  html.vA .csdock,html.vB .csdock{display:flex;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateX(-50%);gap:4px;padding:5px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
  .csdock button{display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--text);font:inherit;font-weight:800;font-size:14.5px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .csdock button.p{background:var(--text);color:var(--bg)}
  .cstoast{display:block;position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:31;transform:translate(-50%,8px);max-width:calc(100vw - 40px);background:var(--text);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s}
  .cstoast.on{opacity:1;transform:translate(-50%,0)}
}
/* ---- phones ---- */
.lb .acts button{white-space:nowrap}
.lb .acts .xb{width:48px;padding:0;display:grid;place-items:center}
@media(max-width:600px){
  /* the header: back and name on one line, the time range under it on the left */
  .top{margin-bottom:14px}
  .controls{justify-items:stretch;margin-bottom:16px}
  .perw .menu{left:0;right:auto;transform-origin:top left}
  /* themes: one row you can swipe, with All themes at the end */
  .thm{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scroll-padding:0 16px}
  /* enlarged story: fills the screen, actions in a calm bar at the bottom */
  .lb{padding:0;background:rgba(10,10,10,.97);place-items:stretch}
  .lb .box{height:100%;width:100%;grid-template-rows:1fr auto auto;align-items:center;justify-items:center;gap:12px;padding:max(64px,env(safe-area-inset-top,0px)) 16px max(18px,env(safe-area-inset-bottom,0px))}
  #lbc{width:100%;height:100%;min-height:0;container-type:size}
  .lb .sl{width:min(100cqw,100cqh*9/16);border-radius:20px}
  .lb .acts{width:100%;max-width:420px;display:grid;grid-template-columns:48px 1fr 1fr;gap:10px}
  .lb .acts button{height:48px;padding:0 12px;font-size:15px}

}

<script>
(function(){'use strict';
const RAW=__DATA__,TODAY='2026-11-03';
const E=RAW.map(r=>({date:r[0],type:r[1]==='s'?'sale':r[1]==='r'?'refund':'purchase',platform:r[2]||'Other',name:r[3],amount:r[4],net:r[5],qty:r[6]||1,no:r[7]||'',set:r[8]||''}));
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=c=>(c<0?'−':'')+'$'+(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const short=c=>(c<0?'−':'')+'$'+Math.round(Math.abs(c)/100).toLocaleString('en-US');
const signedS=c=>(c>=0?'+':'−')+'$'+Math.round(Math.abs(c)/100).toLocaleString('en-US');
const signed=c=>(c>=0?'+':'−')+money(Math.abs(c));
const mName=(k,o)=>new Date(k+'-15T12:00:00').toLocaleString('en-US',o||{month:'long'});
const dShort=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const days=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const key=e=>e.name.toLowerCase().replace(/[^a-z0-9]/g,'')+'|'+e.no;
const cnt=(n,a,b)=>n+' '+(n===1?a:b),BUDGET=15000,sn=n=>n.split(',')[0].trim();
function tot(l){let s=0,k=0,sp=0,f=0,r=0,nb=0,ns=0;l.forEach(e=>{if(e.type==='sale'){s+=e.amount;k+=e.net;f+=e.amount-e.net;ns+=e.qty}else if(e.type==='purchase'){sp+=e.amount;nb+=e.qty}else r+=e.amount});return {sales:s,kept:k-r,spent:sp,fees:f,profit:k-r-sp,nb,ns,n:l.length}}
// ---------- time ranges ----------
const y=+TODAY.slice(0,4),PER=[['l12','Last 12 months'],['ytd','This year'],['ly','Last year · '+(y-1)],['all','All time']];let per='l12',cust=null;
function months(p){const out=[];let a,b;if(p==='l12'){const t=new Date(TODAY+'T12:00:00');for(let i=11;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}}
  else if(p==='ytd'){for(let m=1;m<=+TODAY.slice(5,7);m++)out.push(y+'-'+String(m).padStart(2,'0'))}else if(p==='ly'){for(let m=1;m<=12;m++)out.push((y-1)+'-'+String(m).padStart(2,'0'))}
  else if(p==='custom'&&cust){let d=new Date(cust[0]+'-15T12:00:00');while(true){const k=d.toISOString().slice(0,7);out.push(k);if(k>=cust[1])break;d.setMonth(d.getMonth()+1)}}
  else{const f=E.reduce((a,e)=>e.date<a?e.date:a,TODAY).slice(0,7);let d=new Date(f+'-15T12:00:00');while(true){const k=d.toISOString().slice(0,7);out.push(k);if(k>=TODAY.slice(0,7))break;d.setMonth(d.getMonth()+1)}}return out}
// ---------- the five stories, each with three things it can show ----------
function model(){const M=months(per),set=new Set(M),L=E.filter(e=>set.has(e.date.slice(0,7))),t=tot(L),lab=per==='custom'?customLab():per==='ytd'?String(y):per==='ly'?String(y-1):PER.find(x=>x[0]===per)[1];
  const by=M.map(m=>tot(L.filter(e=>e.date.slice(0,7)===m)));
  const buys={},sells={};E.forEach(e=>{const k=key(e);if(e.type==='purchase')(buys[k]=buys[k]||[]).push(e)});L.forEach(e=>{if(e.type==='sale')(sells[key(e)]=sells[key(e)]||[]).push(e)});
  const flips=Object.keys(sells).filter(k=>buys[k]).map(k=>{const b=buys[k].slice().sort((x,z)=>x.date<z.date?-1:1)[0],s=sells[k][sells[k].length-1],c=buys[k].reduce((a,e)=>a+e.amount,0),kept=sells[k].reduce((a,e)=>a+e.net,0),g=sells[k].reduce((a,e)=>a+e.amount,0);return {name:b.name,b,s,cost:c,kept,gross:g,gain:kept-c,held:Math.max(0,days(b.date,s.date))}}).sort((a,b)=>b.gain-a.gain);
  const sp={};L.filter(e=>e.type==='purchase').forEach(e=>{sp[e.platform]=(sp[e.platform]||0)+e.amount});const plats=Object.keys(sp).map(k=>({k,v:sp[k]})).sort((a,b)=>b.v-a.v);
  const under=by.filter(x=>x.spent<=BUDGET).length,avg=Math.round(t.spent/Math.max(1,M.length)),light=by.reduce((a,x,i)=>x.spent<by[a].spent?i:a,0),busy=by.reduce((a,x,i)=>x.n>by[a].n?i:a,0);
  const soldKeys=new Set(Object.keys(sells)),hold=L.filter(e=>e.type==='purchase'&&!E.some(s=>s.type==='sale'&&key(s)===key(e)&&s.date>=e.date)),hv=hold.reduce((a,e)=>a+e.amount,0);

  // cumulative profit line for "The money"
  let run=0;const cum=by.map(x=>run+=x.profit),mn=Math.min(0,...cum),mx=Math.max(1,...cum),pts=cum.map((v,i)=>[(i/(Math.max(1,cum.length-1)))*260,290-((v-mn)/(mx-mn||1))*250]);
  const line='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  const area=line+' L260 300 L0 300Z';
  const vMoney='<svg viewBox="0 0 260 300" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><defs><linearGradient id="gg'+per+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc)" stop-opacity=".38"/><stop offset="1" style="stop-color:var(--acc)" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#gg'+per+')"/><path d="'+line+'" fill="none" style="stroke:var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
  const ARTG=['linear-gradient(155deg,#d9577a,#7d0b2b)','linear-gradient(155deg,#5fa0d6,#174b78)','linear-gradient(155deg,#8cc96a,#2e5c12)','linear-gradient(155deg,#8a8983,#3a3936)','linear-gradient(155deg,#f0a35c,#a5551a)'],ag=n=>ARTG[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%ARTG.length];
  const card=(n,st)=>'<span class="card" style="background:'+ag(n)+';'+(st||'')+'">'+esc(n.replace(/^(SS|SSB)\s+/,'')[0])+'</span>';
  const f0=flips[0],bmax=Math.max(BUDGET*1.3,...by.map(x=>x.spent));
  const vBudget='<div class="bars">'+by.slice(-12).map(x=>'<i class="'+(x.spent>BUDGET?'o':'')+'" style="height:'+Math.max(1,x.spent/bmax*100).toFixed(1)+'%"></i>').join('')+'<div class="bl" style="bottom:'+(BUDGET/bmax*100).toFixed(1)+'%"></div></div><div class="mon">'+M.slice(-12).map(m=>'<span>'+mName(m,{month:'narrow'})+'</span>').join('')+'</div>';
  const vBars=plats.slice(0,4).map((x,i)=>'<div class="rr"><div class="rt"><span>'+esc(x.k)+'</span><span>'+short(x.v)+'</span></div><div class="bk"><i style="width:'+(x.v/plats[0].v*100).toFixed(1)+'%"></i></div></div>').join('');
  return {lab,stories:[
   {name:'The money',opts:[
     {k:'Profit',top:'<p class="p">You spent '+short(t.spent)+' and made back '+short(t.kept)+'.</p><div class="num" style="font-size:17cqmin">'+signedS(t.profit)+'</div><div class="chips"><span class="chip">'+roi+'% ROI</span><span class="chip o">'+short(Math.round(t.profit/Math.max(1,M.length)))+' a month</span></div>',vis:vMoney},
     {k:'Sales',top:'<p class="p">You sold '+short(t.sales)+' worth of cards.</p><div class="num" style="font-size:17cqmin">'+short(t.sales)+'</div><div class="chips"><span class="chip">'+cnt(t.ns,'card','cards')+' sold</span><span class="chip o">'+esc(lab)+'</span></div>',vis:vMoney},
     {k:'ROI',top:'<p class="p">Every $1 you spent came back as $'+per1+'.</p><div class="num" style="font-size:20cqmin">'+roi+'%</div><div class="chips"><span class="chip">ROI</span><span class="chip o">'+short(t.fees)+' in fees</span></div>',vis:vMoney}]},
   {name:'Your biggest win',opts:f0?[
     {k:'Biggest win',top:'<div class="h">'+esc(sn(f0.name))+(f0.cost&&f0.kept/f0.cost>=2?' '+(f0.kept/f0.cost>=3?'tripled':'doubled')+' your money.':' was your best flip.')+'</div><div class="chips"><span class="chip">Bought '+short(f0.cost)+'</span><span class="chip">Sold '+short(f0.gross)+'</span></div>',vis:card(f0.name)+'<div class="stk">'+signed(f0.gain)+'</div>'},
     {k:'Its journey',top:'<div class="h">'+f0.held+' days from buy to sale.</div><div class="tl"><div><i></i><span>Bought<small>'+dShort(f0.b.date)+' · '+esc(f0.b.platform)+'</small></span><span>'+short(f0.cost)+'</span></div><div><i></i><span>Sold<small>'+dShort(f0.s.date)+' · '+esc(f0.s.platform)+'</small></span><span>'+short(f0.gross)+'</span></div><div><i></i><span>You kept<small>after fees and shipping</small></span><span>'+short(f0.kept)+'</span></div></div>',vis:card(f0.name,'width:34cqmin;font-size:13cqmin;top:62%')},
     {k:'Biggest sale',top:'<div class="h">'+esc(sn(bigSale.name))+' sold for '+short(bigSale.amount)+'.</div><div class="chips"><span class="chip">'+esc(bigSale.platform)+'</span><span class="chip o">'+dShort(bigSale.date)+'</span></div>',vis:card(bigSale.name)+'<div class="stk">'+short(bigSale.amount)+'</div>'}]:[{k:'Biggest win',top:'<div class="h">Your first flip will show up here.</div>',vis:''}]},
   {name:'Where you buy',opts:plats.length?[
     {k:'Top platform',top:'<div class="h" style="font-size:11cqmin">You spent the most on '+esc(plats[0].k)+'.</div><p class="p">'+Math.round(plats[0].v/Math.max(1,t.spent)*100)+'% of everything you spent went through '+esc(plats[0].k)+'.</p>',vis:'<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center">'+vBars+'</div>'},
     {k:'Per card',top:'<div class="h" style="font-size:11cqmin">You paid about '+short(t.spent/Math.max(1,t.nb))+' per card.</div><p class="p">'+short(t.spent)+' across '+cnt(t.nb,'card','cards')+'.</p>',vis:'<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center">'+vBars+'</div>'},
     {k:'Runner-up',top:'<div class="h" style="font-size:11cqmin">'+(plats[1]?esc(plats[1].k)+' was your second stop.':'You bought everything in one place.')+'</div><p class="p">'+(plats[1]?Math.round(plats[1].v/Math.max(1,t.spent)*100)+'% of your spend, '+short(plats[1].v)+'.':'')+'</p>',vis:'<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center">'+vBars+'</div>'}]:[{k:'Top platform',top:'<div class="h">No purchases in this range.</div>',vis:''}]},
   {name:'Staying accountable',opts:[
     {k:'Months under',top:'<div class="num" style="font-size:24cqmin">'+under+'<small>of '+M.length+'</small></div><div class="h" style="font-size:8cqmin">months under budget.</div>',vis:vBudget},
     {k:'Avg spend',top:'<div class="num" style="font-size:20cqmin">'+short(avg)+'<small>a month</small></div><div class="h" style="font-size:8cqmin">your average spend.</div><div class="chips"><span class="chip">Budget: '+short(BUDGET)+'</span></div>',vis:vBudget},

   {name:'Your collection',opts:[
     {k:'Sold',top:'<div class="num" style="font-size:22cqmin">'+(t.nb?Math.min(100,Math.round(t.ns/t.nb*100)):0)+'%</div><div class="h" style="font-size:8cqmin">of the cards you bought have sold.</div><div class="chips"><span class="chip">'+cnt(t.nb,'bought','bought')+'</span><span class="chip o">'+t.ns+' sold</span></div>',vis:'<div class="fan">'+L.filter(e=>e.type==='sale').slice(0,3).map(e=>card(e.name)).join('')+'</div>'},
     {k:'Still holding',top:'<div class="num" style="font-size:22cqmin">'+hold.length+'</div><div class="h" style="font-size:8cqmin">cards still on your shelf.</div><div class="chips"><span class="chip">You paid '+short(hv)+'</span></div>',vis:'<div class="fan">'+hold.slice(0,3).map(e=>card(e.name)).join('')+'</div>'},
     {k:'Busiest month',top:'<div class="h">'+mName(M[busy])+' was your busiest month.</div><p class="p">'+[by[busy].ns?cnt(by[busy].ns,'card','cards')+' sold':'',by[busy].nb?cnt(by[busy].nb,'card','cards')+' bought':''].filter(Boolean).join(' and ')+'.</p>',vis:'<div class="fan">'+L.filter(e=>e.date.slice(0,7)===M[busy]).slice(0,3).map(e=>card(e.name)).join('')+'</div>'}]}
  ]}}
// ---------- themes: each gives every story its own colors ----------
const lum=h=>{const v=parseInt(h.slice(1,7),16);return (0.299*(v>>16)+0.587*(v>>8&255)+0.114*(v&255))/255};
const P=(bg,ink,acc,stk)=>{const solid=bg.startsWith('#')?bg:'#444',dk=lum(solid)<.55;return {bg,ink,acc,chip:acc,chipink:lum(acc)>.55?'#141414':'#ffffff',chip2:dk?'rgba(255,255,255,.16)':'rgba(0,0,0,.08)',trk:dk?'rgba(255,255,255,.2)':'rgba(0,0,0,.1)',o:dk?'#ff8fb1':'#d6405f',dash:dk?'rgba(255,255,255,.7)':'rgba(0,0,0,.5)',stk:stk||acc,stki:lum(stk||acc)>.55?'#141414':'#ffffff'}};
const TH=[
 ['Jewel',[P('#14452c','#eaffd7','#c4f27a','#bc103e'),P('#f6efe2','#1b1a18','#bc103e','#bc103e'),P('#bc103e','#fff0f3','#ffffff'),P('#241c3d','#fbeaff','#c4f27a'),P('#c4f27a','#12391f','#14452c')]],
 ['Voltage',[P('#1d3fe0','#eff2fd','#ffe81a'),P('#e9eeff','#080f3c','#1d3fe0','#ffe81a'),P('#ffe81a','#0a1450','#1d3fe0'),P('#0a1450','#eeeff3','#ffe81a'),P('#1d3fe0','#ffffff','#ffe81a')]],

 ['Matcha',[P('#c8d8a8','#22301a','#4f6b2b'),P('#eef3e2','#22301a','#4f6b2b'),P('#4f6b2b','#f3f8e8','#e5efc9'),P('#22301a','#e5efc9','#a9c47a'),P('#a9c47a','#22301a','#22301a')]],

const PHT=matchMedia('(max-width:600px)');PHT.addEventListener&&PHT.addEventListener('change',()=>paintChips());
let NAME='';const EMB=(()=>{try{return window.parent!==window&&typeof parent.cbStoriesBack==='function'}catch(e){return false}})(),foot=()=>NAME?NAME+' · Card Tab':'Card Tab';
let th=0,mi=[0,0,0,0,0];
const sw=t=>t[1].slice(0,3).map(p=>'<span style="background:'+(p.bg.startsWith('#')?p.bg:p.bg.match(/#\w{6}/)[0])+'"></span>').join('');
const FEW=5;
function paintChips(){const F=PHT.matches?2:FEW,show=[...Array(F).keys()];if(th>=F)show[F-1]=th;$('thm').innerHTML=show.map(i=>'<button class="tchip" aria-pressed="'+(i===th)+'" data-i="'+i+'"><span class="tsw">'+sw(TH[i])+'</span>'+TH[i][0]+'</button>').join('')+'<button class="tchip more" data-all>All '+TH.length+' themes ›</button>'}
function paintGrid(){$('tgrid').innerHTML=TH.map((t,i)=>'<button class="topt" aria-pressed="'+(i===th)+'" data-i="'+i+'"><span class="tsw big">'+sw(t)+'</span><span>'+t[0]+'</span></button>').join('')}
function setTheme(i){th=i;paintChips();document.querySelectorAll('#track .sl').forEach(el=>paintStory(el,+el.dataset.n));try{localStorage.setItem('cs.theme',th)}catch(err){}}
paintChips();
$('tgrid').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;setTheme(+b.dataset.i);paintGrid();$('ths-s').textContent=TH[th][0]+' is on. Pick another or '+(matchMedia('(hover:none)').matches?'tap':'click')+' Done.';$('ths-s').classList.add('msg')});

const ARROWS='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V5M3 9l4-4 4 4"/><path d="M17 4v15M13 15l4 4 4-4"/></svg>';
let D=null;
function paintStory(el,n){const p=TH[th][1][n%TH[th][1].length],s=el.style;s.setProperty('--sbg',p.bg);['ink','acc','chip','chipink','chip2','trk','o','dash','stk','stki'].forEach(k=>s.setProperty('--'+k,p[k]))}
function storyHTML(n){const st=D.stories[n],o=st.opts[mi[n]%st.opts.length];return '<div class="in"><div><div class="lab">'+st.name+'</div>'+o.top+'</div><div class="vis">'+o.vis+'</div></div><div class="ft"><span>'+esc(foot())+'</span><span>'+esc(D.lab)+'</span></div>'}
function render(){D=model();$('track').innerHTML=D.stories.map((st,n)=>'<div class="cell"><button class="sl" data-n="'+n+'" aria-label="'+st.name+'. Tap to enlarge">'+storyHTML(n)+'</button><button class="mb" data-mb="'+n+'"><span class="k">Showing</span><span>'+st.opts[mi[n]%st.opts.length].k+'</span>'+ARROWS+'</button></div>').join('');
  document.querySelectorAll('#track .sl').forEach(el=>paintStory(el,+el.dataset.n));$('dots').innerHTML=D.stories.map((_,i)=>'<i class="'+(i?'':'on')+'"></i>').join('')}
render();
$('thm').addEventListener('click',e=>{if(e.target.closest('[data-all]')){openSheet('ths');return}const b=e.target.closest('[data-i]');if(!b)return;setTheme(+b.dataset.i)});
const allMonths=months('all'),mLab=m=>mName(m,{month:'short',year:'numeric'}),customLab=()=>cust[0]===cust[1]?mLab(cust[0]):mLab(cust[0])+' – '+mLab(cust[1]);
function setPer(p){per=p;$('perl').textContent=p==='custom'?customLab():PER.find(x=>x[0]===p)[1];render();document.querySelectorAll('#track .sl').forEach(el=>{el.classList.add('swap');setTimeout(()=>el.classList.remove('swap'),450)})}
function openMenu(){const m=$('perm');m.innerHTML=PER.map(p=>'<button role="menuitemradio" aria-checked="'+(p[0]===per)+'" data-p="'+p[0]+'">'+p[1]+'</button>').join('')+'<hr><button role="menuitemradio" aria-checked="'+(per==='custom')+'" data-p="custom">Custom dates…</button>';m.hidden=false;$('perb').setAttribute('aria-expanded','true');m.style.left='';m.style.right='';const r=m.getBoundingClientRect();if(r.left<8){m.style.left='0';m.style.right='auto'}else if(r.right>innerWidth-8){m.style.right='0';m.style.left='auto'}}
function closeMenu(){$('perm').hidden=true;$('perb').setAttribute('aria-expanded','false')}
$('perb').addEventListener('click',e=>{e.stopPropagation();if(PHS.matches){closeMenu();openSheet('crs',true);return}$('perm').hidden?openMenu():closeMenu()});
$('perm').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;closeMenu();if(b.dataset.p==='custom')openSheet('crs',false);else setPer(b.dataset.p)});
document.addEventListener('click',e=>{if(!e.target.closest('.perw'))closeMenu()});
// custom range: pick the first and last month
// month tiles, styled like Card Board's calendar: first tap sets the start, second the end; tap From or To to change just that one
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],PHS=matchMedia('(max-width:600px)');let mp={a:null,b:null,pick:'a'};
function drawMp(){const ys=[...new Set(allMonths.map(m=>m.slice(0,4)))];
  $('mgrid').innerHTML=ys.map(y=>'<div class="myr"><b>'+y+'</b><div class="mtiles">'+MS.map((n,i)=>{const m=y+'-'+String(i+1).padStart(2,'0'),dis=!allMonths.includes(m),s=m===mp.a||m===mp.b,span=mp.a&&mp.b&&mp.a!==mp.b,inr=span&&m>mp.a&&m<mp.b;
    return '<button type="button" class="mt'+(s?' sel':'')+(inr?' in':'')+(span&&m===mp.a?' rs':'')+(span&&m===mp.b?' re':'')+'" data-m="'+m+'"'+(dis?' disabled':'')+' aria-pressed="'+s+'" aria-label="'+mLab(m)+'">'+n+'</button>'}).join('')+'</div></div>').join('');
  $('mp-a').querySelector('b').textContent=mp.a?mLab(mp.a):'Pick a month';$('mp-b').querySelector('b').textContent=mp.b?mLab(mp.b):'Pick a month';
  $('mp-a').classList.toggle('on',mp.pick==='a');$('mp-b').classList.toggle('on',mp.pick==='b');
  const ok=mp.a&&mp.b;$('cr-go').disabled=!ok;$('cr-n').textContent=ok?cnt(allMonths.indexOf(mp.b)-allMonths.indexOf(mp.a)+1,'month','months'):'Tap the last month.'}
$('mgrid').addEventListener('click',e=>{const t=e.target.closest('[data-m]');if(!t||t.disabled)return;const m=t.dataset.m;
  if(mp.pick==='b'&&mp.a){if(m<mp.a){mp.b=mp.a;mp.a=m}else mp.b=m;mp.pick='a'}else{mp.a=m;mp.b=null;mp.pick='b'}drawMp()});
$('mp-a').addEventListener('click',()=>{mp.pick='a';drawMp()});$('mp-b').addEventListener('click',()=>{mp.pick='b';drawMp()});
$('cr-go').addEventListener('click',()=>{if(!mp.a||!mp.b)return;cust=[mp.a,mp.b];closeSheet('crs');setPer('custom')});
// phones: the time range opens one sheet with quick picks; Custom dates opens the month tiles inside it
function paintPre(){const cu=$('crs').classList.contains('cust');$('spre').innerHTML=PER.map(p=>'<button type="button" class="srow" role="radio" data-sp="'+p[0]+'" aria-checked="'+(p[0]===per&&!cu)+'">'+p[1]+'<span class="ck" aria-hidden="true">✓</span></button>').join('')+'<button type="button" class="srow" data-sp="custom" aria-expanded="'+cu+'" aria-checked="'+cu+'">Custom dates<span class="cv" aria-hidden="true">›</span></button>'}
$('spre').addEventListener('click',e=>{const b=e.target.closest('[data-sp]');if(!b)return;const k=b.dataset.sp,w=$('crs');
  if(k==='custom'){w.classList.toggle('cust');paintPre();if(w.classList.contains('cust')){const g=$('mgrid');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)g.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:280,easing:'cubic-bezier(.2,.8,.2,1)'});setTimeout(()=>$('cr-go').scrollIntoView({block:'nearest',behavior:'smooth'}),60)}return}
  paintPre();b.setAttribute('aria-checked','true');setTimeout(()=>{closeSheet('crs');setPer(k)},140)});
// sheets
function openSheet(id,pre){const w=$(id);if(id==='crs'){const M0=months(per).filter(m=>allMonths.includes(m));mp={a:M0[0]||allMonths[0],b:M0[M0.length-1]||allMonths[allMonths.length-1],pick:'a'};w.classList.toggle('pre',!!pre);w.classList.toggle('cust',!pre||per==='custom');$('crs-h').textContent=pre?'Dates':'Custom dates';paintPre();drawMp()}if(id==='ths'){paintGrid();$('ths-s').textContent=TH.length+' looks for your stories. '+(matchMedia('(hover:none)').matches?'Tap':'Click')+' one to try it.';$('ths-s').classList.remove('msg')}w.hidden=false;w.classList.remove('out')}
function closeSheet(id){const w=$(id);w.classList.add('out');setTimeout(()=>{w.hidden=true},190)}
document.querySelectorAll('.sheetw').forEach(w=>w.addEventListener('click',e=>{if(e.target===w||e.target.closest('[data-close]'))closeSheet(w.id)}));
$('track').addEventListener('click',e=>{const mb=e.target.closest('[data-mb]');if(mb){const n=+mb.dataset.mb;mi[n]=(mi[n]+1)%D.stories[n].opts.length;const sl=$('track').querySelector('.sl[data-n="'+n+'"]');sl.innerHTML=storyHTML(n);sl.classList.remove('swap');void sl.offsetWidth;sl.classList.add('swap');mb.children[1].textContent=D.stories[n].opts[mi[n]].k;return}
  const sl=e.target.closest('.sl');if(sl)enlarge(+sl.dataset.n)});
$('track').addEventListener('scroll',()=>{const tr=$('track'),c=tr.querySelector('.cell');if(!c)return;const i=Math.round(tr.scrollLeft/(c.offsetWidth+22));$('dots').querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k===i))},{passive:true});
// enlarged view
const lb=$('lb');function enlarge(n){const c=document.createElement('div');c.className='sl';c.setAttribute('role','img');c.setAttribute('aria-label',D.stories[n].name);c.innerHTML=storyHTML(n);paintStory(c,n);$('lbc').innerHTML='';$('lbc').appendChild(c);$('lbn').textContent='';lb.hidden=false;lb.classList.remove('out');lb.querySelector('[data-a="close"]').focus()}
function shut(){lb.classList.add('out');setTimeout(()=>{lb.hidden=true},190)}
lb.addEventListener('click',e=>{if(e.target===lb){shut();return}const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close')shut();else $('lbn').textContent=b.dataset.a==='save'?'In the app this saves the story as an image, sized for Instagram and TikTok.':'In the app this opens your phone’s share sheet.'});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!lb.hidden)shut();else{const w=document.querySelector('.sheetw:not([hidden])');if(w)closeSheet(w.id);else if(!$('perm').hidden)closeMenu();else if(EMB)goBack()}});
try{const t=+localStorage.getItem('cs.theme');if(t>0&&t<TH.length)setTheme(t)}catch(e){}
// ---- linked to Card Board: same name, light/dark and time range; the back arrow returns to the board ----
function goBack(){if(!lb.hidden)shut();closeMenu();try{parent.cbStoriesBack()}catch(e){}}
document.querySelector('.top .back').addEventListener('click',()=>{if(EMB)goBack()});
window.csSync=function(){
  try{NAME=EMB&&parent.cbName?parent.cbName():((JSON.parse(localStorage.getItem('cb.profile')||'null')||{}).first||'').trim()}catch(e){}
  try{const t=localStorage.getItem('cb.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}catch(e){}
  let np='l12',nc=null;
  try{const v=JSON.parse(localStorage.getItem('cb.view')||'null');if(v){if(['l12','ytd','ly','all'].includes(v.period))np=v.period;else if(v.period==='custom'&&v.custom&&v.custom.from){const a=v.custom.from.slice(0,7),b=v.custom.to.slice(0,7);if(allMonths.includes(a)||allMonths.includes(b)){np='custom';nc=[a<allMonths[0]?allMonths[0]:a,b]}}}}catch(e){}
  if(nc)cust=nc;per=np;$('perl').textContent=per==='custom'?customLab():PER.find(x=>x[0]===per)[1];render()};
csSync();
window.csEnter=function(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const parts=[document.querySelector('.top'),document.querySelector('.controls')].filter(Boolean);parts.forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:420,delay:80+i*50,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}));
  document.querySelectorAll('#track .cell').forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(26px) scale(.97)'},{opacity:1,transform:'none'}],{duration:560,delay:170+i*55,easing:'cubic-bezier(.2,.9,.25,1)',fill:'backwards'}))};
if(EMB)document.querySelector('.foot').hidden=true;
// thumb bar on phones: save or share the story you're looking at
let toastT=0;$('csdock').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;const dots=[...$('dots').querySelectorAll('i')],n=Math.max(0,dots.findIndex(d=>d.classList.contains('on'))),nm=D.stories[n].name;
  const m=b.dataset.d==='save'?'In the app this saves “'+nm+'” as an image, sized for Instagram and TikTok.':'In the app this opens your phone’s share sheet for “'+nm+'”.';
  const t=$('cstoast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)});
})();
</script>
